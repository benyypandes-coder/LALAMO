name: Build Kurt Dhylan Moto Shop Inventory APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install Android workload
        run: dotnet workload install maui-android

      - name: Restore
        run: dotnet restore KurtDhylanMotoShopInventory.csproj

      - name: Build APK
        run: dotnet publish KurtDhylanMotoShopInventory.csproj -c Release -f net9.0-android --no-restore -p:AndroidPackageFormat=apk -p:AndroidKeyStore=false

      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK=$(find bin/Release/net9.0-android -type f -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then echo "APK not found"; exit 1; fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KurtDhylanMotoShopInventory-APK
          path: ${{ steps.apk.outputs.path }}
