name: Build Kurt Dhylan Moto Shop Inventory APK

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Install Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Install .NET
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 4. Install MAUI Android workload
      - name: Install MAUI Workload
        run: |
          dotnet workload install maui-android

      # 5. Restore dependencies
      - name: Restore Dependencies
        run: |
          dotnet restore

      # 6. Build Android APK
      - name: Build APK
        run: |
          dotnet publish \
            -f net8.0-android \
            -c Release \
            -p:AndroidPackageFormat=apk \
            --no-restore

      # 7. Find generated APK
      - name: List APK Files
        run: |
          find . -type f -name "*.apk"

      # 8. Upload APK as GitHub Artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kurt-Dhylan-Moto-Shop-Inventory-APK
          path: |
            **/bin/Release/net8.0-android/**/*.apk
          if-no-files-found: error
